<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        if (typeof window === 'undefined' || !window.WebSocket) return;
        var NativeWS = window.WebSocket;
        function SafeWS(url, protocols) {
          var isVite =
            protocols === 'vite-hmr' ||
            protocols === 'vite-ping' ||
            (Array.isArray(protocols) &&
              (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) ||
            (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1));
          if (isVite) {
            var listeners = {};
            var dummy = {
              readyState: 1,
              OPEN: 1,
              CONNECTING: 0,
              CLOSING: 2,
              CLOSED: 3,
              protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
              url: String(url || ''),
              bufferedAmount: 0,
              extensions: '',
              binaryType: 'blob',
              send: function () {},
              close: function () {
                this.readyState = 3;
              },
              addEventListener: function (type, fn) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(fn);
              },
              removeEventListener: function () {},
              dispatchEvent: function () {
                return true;
              },
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
            };
            setTimeout(function () {
              var evt = new Event('open');
              if (typeof dummy.onopen === 'function') {
                try {
                  dummy.onopen(evt);
                } catch (e) {}
              }
              if (listeners['open']) {
                listeners['open'].forEach(function (fn) {
                  try {
                    fn(evt);
                  } catch (e) {}
                });
              }
            }, 0);
            return dummy;
          }
          return protocols !== undefined ? new NativeWS(url, protocols) : new NativeWS(url);
        }
        SafeWS.prototype = NativeWS.prototype;
        SafeWS.CONNECTING = NativeWS.CONNECTING;
        SafeWS.OPEN = NativeWS.OPEN;
        SafeWS.CLOSING = NativeWS.CLOSING;
        SafeWS.CLOSED = NativeWS.CLOSED;
        window.WebSocket = SafeWS;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Portal — Role-Based College Management System</title>
    <meta
      name="description"

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('campus_portal_theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
